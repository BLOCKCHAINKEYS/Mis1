# Render Blueprint for Burger Quest v6
services:
  - type: web
    runtime: static
    name: burger-quest-public
    buildCommand: test -f site/index.html && test -f site/game.js && echo "Burger Quest static build ready"
    staticPublishPath: ./site
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: "nosniff"
      - path: /*
        name: Referrer-Policy
        value: "no-referrer"
      - path: /*
        name: X-Frame-Options
        value: "DENY"
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: "same-origin"
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; worker-src 'self'; manifest-src 'self'"
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=86400"
      - path: /sw.js
        name: Cache-Control
        value: "no-cache, no-store, must-revalidate"